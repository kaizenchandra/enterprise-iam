# Local-only email testing. Run with the base Compose file and --profile mail.
services:
  iam:
    environment:
      ACCOUNT_ACTIONS_ENABLED: "true"
      REGISTRATION_ENABLED: "true"
      ACCOUNT_CONSOLE_ORIGIN: http://localhost:3000
      ACCOUNT_PUBLIC_ORIGIN: http://iam.localhost:3000
      ACCOUNT_ENCRYPTION_PASSWORD: ${ACCOUNT_ENCRYPTION_PASSWORD:?Run scripts/init-local.sh}
      ACCOUNT_ENCRYPTION_SALT: ${ACCOUNT_ENCRYPTION_SALT:?Run scripts/init-local.sh}
      PASSKEYS_ENABLED: "true"
      PASSKEY_ORIGINS: http://iam.localhost:3000,http://iam.localhost:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_STARTTLS: "false"
    depends_on:
      mailpit:
        condition: service_started
