name: IAM verification
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: mvn -B verify
      - name: Initialize isolated local demo inputs
        run: ./scripts/init-local.sh
      - name: Start UI test stores
        run: docker compose --profile mail up -d --wait --wait-timeout 60 postgres redis mailpit
      - name: Verify session UI end to end
        timeout-minutes: 5
        run: python3 tests/backchannel_stack_test.py --mode ui
      - name: Verify account actions end to end
        timeout-minutes: 5
        run: python3 tests/backchannel_stack_test.py --mode account
      - name: Verify WebAuthn virtual-device matrix and revocation
        timeout-minutes: 10
        run: python3 tests/passkeys_matrix.py
      - name: Stop local test stores
        if: always()
        run: docker compose --profile mail down
